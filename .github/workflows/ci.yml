name: CI

# Build check only: no release upload, no write permissions.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  vet-and-build:
    name: vet + build (linux/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'

      - name: go build
        run: go build -trimpath -ldflags "-s -w" -o "$RUNNER_TEMP/lazyports-linux-${{ matrix.goarch }}" .
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
